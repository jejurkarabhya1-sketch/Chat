name: Build Veyra clients

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veyra-client-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Validate database migration history
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
      - name: Compile backend
        run: python -m compileall -q backend/app backend/migrations
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest app -q

  flutter-builds:
    name: Flutter web and Android builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show toolchain
        run: flutter --version
      - name: Generate missing platform scaffolding
        run: |
          if [ ! -d android ] || [ ! -d web ]; then
            flutter create --platforms=android,web --project-name=veyra_messenger .
          fi
      - name: Install Android API 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Configure Android compile SDK
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path

          android = Path("android")
          build_file = next(
              (path for path in (android / "build.gradle", android / "build.gradle.kts") if path.is_file()),
              None,
          )
          if build_file is None:
              raise SystemExit("Generated Android project has no root Gradle build file.")

          sdk_script = android / "compile-sdk.gradle"
          sdk_script.write_text(
              "allprojects { project ->\n"
              "    def configureAndroidSdk = {\n"
              "        def androidComponents = project.extensions.findByName('androidComponents')\n"
              "        if (androidComponents == null) {\n"
              "            throw new GradleException('Android Components extension is unavailable for ' + project.path)\n"
              "        }\n"
              "        androidComponents.finalizeDsl { androidExtension ->\n"
              "            androidExtension.compileSdk = 36\n"
              "        }\n"
              "    }\n"
              "    project.plugins.withId('com.android.application') { configureAndroidSdk() }\n"
              "    project.plugins.withId('com.android.library') { configureAndroidSdk() }\n"
              "}\n"
          )

          build_text = build_file.read_text()
          apply_statement = (
              'apply(from = "compile-sdk.gradle")'
              if build_file.name.endswith(".kts")
              else 'apply from: "compile-sdk.gradle"'
          )
          if apply_statement not in build_text:
              build_file.write_text(f"{build_text.rstrip()}\n\n{apply_statement}\n")
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Configure Web push service worker
        env:
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          path = Path("web/firebase-messaging-sw.js")
          source = path.read_text()
          values = {
              "REPLACE_WITH_FIREBASE_WEB_API_KEY": os.getenv("FIREBASE_WEB_API_KEY", ""),
              "REPLACE_WITH_FIREBASE_WEB_APP_ID": os.getenv("FIREBASE_WEB_APP_ID", ""),
              "REPLACE_WITH_FIREBASE_MESSAGING_SENDER_ID": os.getenv("FIREBASE_MESSAGING_SENDER_ID", ""),
              "REPLACE_WITH_FIREBASE_PROJECT_ID": os.getenv("FIREBASE_PROJECT_ID", ""),
              "REPLACE_WITH_FIREBASE_AUTH_DOMAIN": os.getenv("FIREBASE_AUTH_DOMAIN", ""),
          }
          if all(values.values()):
              for placeholder, value in values.items():
                  source = source.replace(placeholder, value)
              path.write_text(source)
              print("Firebase Web messaging worker configured.")
          else:
              print("::warning::Firebase Web variables are incomplete; web push will remain unconfigured.")
          PYCODE
      - name: Build web release
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_WEB_VAPID_KEY: ${{ vars.FIREBASE_WEB_VAPID_KEY }}
        run: |
          flutter build web --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=FIREBASE_WEB_API_KEY="$FIREBASE_WEB_API_KEY" \
            --dart-define=FIREBASE_WEB_APP_ID="$FIREBASE_WEB_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
            --dart-define=FIREBASE_WEB_VAPID_KEY="$FIREBASE_WEB_VAPID_KEY"
      - name: Build Android APK release
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          FIREBASE_ANDROID_API_KEY: ${{ vars.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=FIREBASE_ANDROID_API_KEY="$FIREBASE_ANDROID_API_KEY" \
            --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: veyra-web-${{ github.sha }}
          path: mobile/build/web/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: veyra-android-apk-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
